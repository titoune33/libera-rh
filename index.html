<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <title>Équitia — Conformité salariale, en toute sérénité</title>

      name="description"
      content="Équitia analyse vos écarts de rémunération et génère votre rapport conforme à la directive UE 2023/970. SaaS spécialisé transparence salariale : index d'égalité, fourchettes salariales, plan de rattrapage. Gratuit pour commencer."

    <link rel="canonical" href="https://freebuf.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Équitia — Conformité salariale, sans douleur" />
    <meta
      property="og:description"
      content="Analyse des écarts de rémunération, rapport conforme, fourchettes salariales — en quelques minutes, sans intégration."

    <meta property="og:url" content="https://freebuf.vercel.app/" />
    <meta property="og:site_name" content="Équitia" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Analyse des écarts de rémunération, rapport conforme, fourchettes salariales. Gratuit pour commencer."

    <!-- JSON-LD structured data (schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Équitia",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "SaaS de conformité transparence salariale — analyse des écarts de rémunération, rapport conforme à la directive UE 2023/970, index d'égalité professionnelle, fourchettes salariales et plan de rattrapage.",

      "offers": [
        {
          "@type": "Offer",
          "name": "Gratuit",
          "price": "0",
          "priceCurrency": "EUR"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "49",
          "priceCurrency": "EUR",
          "priceQualifier": "monthly"
        }
      ]
    }

    <!-- Sécurité & compatibilité -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
